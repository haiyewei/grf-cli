[package]
name = "grf"
version = "2.0.1"
edition = "2024"
description = "Rust-native CLI for managing Git reference repositories."
license = "MIT"
repository = "https://github.com/haiyewei/grf-cli"
publish = false

[[bin]]
name = "grf"
path = "src/main.rs"

[dependencies]
camino = { version = "1.2.2", features = ["serde1"] }
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6.5"
comfy-table = "7.2.2"
console = "0.16.3"
dialoguer = "0.12.0"
directories = "6.0.0"
fs-err = "3.3.0"
indicatif = "0.18.4"
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
which = "8.0.2"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.3"
insta = "1.47.2"
predicates = "3.1.4"
serial_test = "3.4.0"
temp-env = "0.3.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
